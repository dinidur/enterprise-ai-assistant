services:
  api:
    build: .
    container_name: eai-api
    env_file: .env
    environment:
      APP_ENV: dev            # JSON logs rather than pretty console output
    ports:
      - "8000:8000"
    volumes:
      # The BM25 index and the corpus are build outputs, not image content:
      # mounting them means re-ingesting does not require a rebuild.
      - ./data:/srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ui:
    build: .
    container_name: eai-ui
    env_file: .env
    environment:
      # Service name, not localhost: the UI container reaches the API over the
      # compose network.
      API_BASE: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    command:
      - streamlit
      - run
      - ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    restart: unless-stopped
